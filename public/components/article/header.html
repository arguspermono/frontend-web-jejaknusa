<!-- Article — Header Section -->
<header class="pt-28 pb-10 bg-white dark:bg-gray-950 transition-colors duration-300">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 mb-8 text-xs" aria-label="breadcrumb">
      <a href="index.html"
         class="text-gray-400 dark:text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors"
         data-i18n="nav_home">Beranda</a>
      <svg class="w-3 h-3 text-gray-300 dark:text-gray-700 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
      <span class="text-gray-400 dark:text-gray-500" data-i18n="article_breadcrumb">Artikel</span>
    </nav>

    <!-- Article Title (filled by JS) -->
    <h1 id="art-title"
        class="text-3xl sm:text-[2.25rem] lg:text-[2.5rem] font-black text-gray-900 dark:text-white leading-[1.18] tracking-tight mb-6">
    </h1>

    <!-- Author + Meta (filled by JS) -->
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2 pb-8 mb-10 border-b border-gray-100 dark:border-gray-800">
      <div class="flex items-center gap-2.5">
        <div id="art-author-avatar"
             class="w-8 h-8 rounded-full bg-brand-red flex items-center justify-center text-white text-xs font-black flex-shrink-0"></div>
        <span id="art-author-name"
              class="text-[0.7rem] font-bold text-brand-red uppercase tracking-[0.12em]"></span>
      </div>
      <span class="text-gray-200 dark:text-gray-700 text-sm hidden sm:inline">·</span>
      <time id="art-date" class="text-[0.7rem] text-gray-400 dark:text-gray-500"></time>
      <span class="text-gray-200 dark:text-gray-700 text-sm hidden sm:inline">·</span>
      <span id="art-readtime" class="text-[0.7rem] text-gray-400 dark:text-gray-500"></span>

      <!-- Share Button -->
      <button
        onclick="navigator.share ? navigator.share({title: document.title, url: location.href}) : navigator.clipboard.writeText(location.href)"
        class="ml-auto flex items-center gap-1.5 text-[0.7rem] font-semibold text-gray-500 dark:text-gray-400
               hover:text-brand-red dark:hover:text-brand-red transition-colors"
        aria-label="share article"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        <span data-i18n="share_btn">Bagikan</span>
      </button>
    </div>

    <!-- Intro Paragraphs (filled by JS) -->
    <p id="art-p1" class="text-base sm:text-[1.0625rem] text-gray-600 dark:text-gray-400 leading-[1.85] mb-5"></p>
    <p id="art-p2" class="text-base sm:text-[1.0625rem] text-gray-600 dark:text-gray-400 leading-[1.85]"></p>

  </div>
</header>
