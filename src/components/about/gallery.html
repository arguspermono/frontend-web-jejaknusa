<!-- About Us — Gallery Section -->
<section class="py-20 bg-[#F8F6F0] dark:bg-gray-950 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">

    <!-- Header -->
    <div class="flex items-end justify-between mb-8 reveal">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <div class="h-px w-10 bg-[#4A5320] dark:bg-[#6B7A2A]"></div>
          <span class="text-xs font-bold tracking-[0.2em] uppercase text-[#4A5320] dark:text-[#c5d06a]" data-i18n="gallery_tag">In the Field</span>
        </div>
        <h2 class="text-3xl sm:text-4xl font-black text-gray-900 dark:text-white tracking-tight" data-i18n="gallery_title">Our Gallery</h2>
      </div>
    </div>

    <!-- Masonry-style grid -->
    <div class="grid grid-cols-12 grid-rows-2 gap-3 h-[480px] sm:h-[560px] reveal">

      <!-- Large left image (spans 5 cols, full 2 rows) -->
      <div class="col-span-5 row-span-2 overflow-hidden rounded-2xl bg-gray-200 dark:bg-gray-800 relative group">
        <img
          src="https://images.unsplash.com/photo-1537953773345-d172ccf13cf1?w=900&q=80"
          alt="Gallery — Bali temple"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl"></div>
      </div>

      <!-- Top middle (spans 4 cols, 1 row) -->
      <div class="col-span-4 row-span-1 overflow-hidden rounded-2xl bg-gray-200 dark:bg-gray-800 relative group">
        <img
          src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80"
          alt="Gallery — mountain landscape"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl"></div>
      </div>

      <!-- Top right (spans 3 cols, 1 row) -->
      <div class="col-span-3 row-span-1 overflow-hidden rounded-2xl bg-gray-200 dark:bg-gray-800 relative group">
        <img
          src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=600&q=80"
          alt="Gallery — beach"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl"></div>
      </div>

      <!-- Bottom middle (spans 4 cols, 1 row) -->
      <div class="col-span-4 row-span-1 overflow-hidden rounded-2xl bg-gray-200 dark:bg-gray-800 relative group">
        <img
          src="https://images.unsplash.com/photo-1501555088652-021faa106b9b?w=800&q=80"
          alt="Gallery — monument valley"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-2xl"></div>
      </div>

      <!-- Bottom right (spans 3 cols, 1 row) — olive accent tile -->
      <div class="col-span-3 row-span-1 overflow-hidden rounded-2xl bg-[#4A5320] dark:bg-[#3a4118] relative flex flex-col items-center justify-center text-white p-6 text-center">
        <p class="text-5xl font-black leading-none">12+</p>
        <p class="text-xs font-semibold tracking-widest uppercase text-white/70 mt-2"><span data-i18n="gallery_years">Years of</span><br/><span data-i18n="gallery_adventure">Adventure</span></p>
      </div>

    </div>
  </div>
</section>
