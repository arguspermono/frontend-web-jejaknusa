<!-- Article — Content + Sidebar -->
<div class="bg-white dark:bg-gray-950 pb-20 transition-colors duration-300">

  <!-- Featured Image (src/alt filled by JS) -->
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 mb-14">
    <figure>
      <img id="art-featured-img"
           src=""
           alt=""
           class="w-full object-cover"
           loading="eager"
      />
      <figcaption id="art-img-caption"
                  class="mt-3 text-xs text-gray-400 dark:text-gray-500 text-center italic leading-relaxed">
      </figcaption>
    </figure>
  </div>

  <!-- Two-column: Article Body + Sidebar -->
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_272px] gap-12 xl:gap-16">

      <!-- ── Main Article Body (entire content injected by JS) ── -->
      <article id="art-body" class="min-w-0"></article>

      <!-- ── Sidebar ──────────────────────────────────────────── -->
      <aside class="lg:sticky lg:top-28 h-fit space-y-7 reveal">

        <!-- Author Card -->
        <div class="rounded-2xl border border-gray-100 dark:border-gray-800 p-5 bg-[#F8F6F0] dark:bg-gray-900">
          <p class="text-[0.65rem] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4"
             data-i18n="sidebar_author">Tentang Penulis</p>
          <div class="flex items-center gap-3 mb-3">
            <div id="art-sidebar-avatar"
                 class="w-11 h-11 rounded-full bg-brand-red flex items-center justify-center text-white font-black text-base flex-shrink-0"></div>
            <div>
              <p id="art-sidebar-author-name" class="text-sm font-bold text-gray-900 dark:text-white leading-tight"></p>
              <p class="text-[0.7rem] text-gray-400 dark:text-gray-500" data-i18n="author_role2">Travel Writer</p>
            </div>
          </div>
          <p id="art-sidebar-bio" class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed"></p>
        </div>

        <!-- Article Info -->
        <div class="rounded-2xl border border-gray-100 dark:border-gray-800 p-5 bg-[#F8F6F0] dark:bg-gray-900">
          <p class="text-[0.65rem] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4"
             data-i18n="sidebar_info">Info Artikel</p>
          <dl class="space-y-3">
            <div class="flex justify-between items-center">
              <dt class="text-xs text-gray-400 dark:text-gray-500" data-i18n="info_date">Tanggal Terbit</dt>
              <dd id="art-info-date" class="text-xs font-semibold text-gray-700 dark:text-gray-300"></dd>
            </div>
            <div class="flex justify-between items-center">
              <dt class="text-xs text-gray-400 dark:text-gray-500" data-i18n="info_read">Waktu Baca</dt>
              <dd id="art-info-readtime" class="text-xs font-semibold text-gray-700 dark:text-gray-300"></dd>
            </div>
            <div class="flex justify-between items-center">
              <dt class="text-xs text-gray-400 dark:text-gray-500" data-i18n="info_views">Pembaca</dt>
              <dd id="art-info-views" class="text-xs font-semibold text-gray-700 dark:text-gray-300"></dd>
            </div>
            <div class="flex justify-between items-center">
              <dt class="text-xs text-gray-400 dark:text-gray-500" data-i18n="info_cat">Kategori</dt>
              <dd id="art-info-cat" class="text-xs font-semibold text-brand-red"></dd>
            </div>
          </dl>
        </div>

        <!-- Popular Articles -->
        <div class="rounded-2xl border border-gray-100 dark:border-gray-800 p-5 bg-[#F8F6F0] dark:bg-gray-900">
          <p class="text-[0.65rem] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4"
             data-i18n="sidebar_popular">Artikel Populer</p>
          <ol class="space-y-4">
            <li class="flex gap-3 items-start">
              <span class="w-5 h-5 rounded-full bg-brand-red text-white text-[0.6rem] font-black flex items-center justify-center flex-shrink-0 mt-0.5">1</span>
              <a href="article.html?id=3"
                 class="text-xs font-semibold text-gray-700 dark:text-gray-300 hover:text-brand-red dark:hover:text-brand-red transition-colors leading-relaxed line-clamp-2"
                 data-i18n="pop1">Sunset Terbaik di Pantai Barat Bali</a>
            </li>
            <li class="flex gap-3 items-start">
              <span class="w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 text-[0.6rem] font-black flex items-center justify-center flex-shrink-0 mt-0.5">2</span>
              <a href="article.html?id=4"
                 class="text-xs font-semibold text-gray-700 dark:text-gray-300 hover:text-brand-red dark:hover:text-brand-red transition-colors leading-relaxed line-clamp-2"
                 data-i18n="pop2">Menjelajahi Padang Pasir Monument Valley</a>
            </li>
            <li class="flex gap-3 items-start">
              <span class="w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 text-[0.6rem] font-black flex items-center justify-center flex-shrink-0 mt-0.5">3</span>
              <a href="article.html?id=1"
                 class="text-xs font-semibold text-gray-700 dark:text-gray-300 hover:text-brand-red dark:hover:text-brand-red transition-colors leading-relaxed line-clamp-2"
                 data-i18n="pop3">Wisata Kuliner Malam di Tokyo</a>
            </li>
          </ol>
        </div>

        <!-- Newsletter -->
        <div class="rounded-2xl bg-[#4A5320] dark:bg-[#3a4118] p-5 text-white">
          <p class="text-sm font-black leading-tight mb-2" data-i18n="newsletter_title">Dapatkan Cerita Terbaru</p>
          <p class="text-xs opacity-80 leading-relaxed mb-4" data-i18n="newsletter_desc"></p>
          <form class="flex flex-col gap-2"
                onsubmit="event.preventDefault(); this.innerHTML='<p class=\'text-xs font-semibold opacity-90\'>Terima kasih! 🎉</p>'">
            <input
              type="email"
              id="newsletter-email"
              class="w-full px-3 py-2.5 rounded-lg text-xs text-gray-900 bg-white/90 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-white/50"
              placeholder="Email kamu..."
              required
            />
            <button
              type="submit"
              class="w-full px-3 py-2.5 bg-white text-[#4A5320] font-bold text-xs rounded-lg hover:bg-[#c5d06a] transition-colors"
              data-i18n="subscribe_btn"
            >Berlangganan</button>
          </form>
        </div>

      </aside>

    </div>
  </div>
</div>
